<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="水木的个人技术博客，记录智能电视、开源软件、家庭影音与数码实践。">
  <title>水木的技术博客</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #62707d;
      --paper: #f5f2ea;
      --card: #fffdf8;
      --accent: #d54b32;
      --line: #ded8cb;
      --shadow: 0 18px 55px rgba(49, 43, 34, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(213, 75, 50, .10), transparent 34rem),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
    }
    .shell { width: min(1080px, calc(100% - 36px)); margin: 0 auto; }
    header { padding: 76px 0 42px; }
    .eyebrow { color: var(--accent); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0 12px; font-size: clamp(2.5rem, 8vw, 5.6rem); line-height: 1.03; letter-spacing: -.05em; }
    .intro { max-width: 650px; margin: 0; color: var(--muted); font-size: 1.12rem; }
    main { padding: 18px 0 88px; }
    .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h2 { margin: 0; font-size: 1.35rem; }
    .count { color: var(--muted); font-size: .92rem; }
    .post {
      display: grid;
      grid-template-columns: minmax(250px, .9fr) minmax(0, 1.25fr);
      overflow: hidden;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform .22s ease, box-shadow .22s ease;
    }
    .post:hover { transform: translateY(-4px); box-shadow: 0 24px 65px rgba(49, 43, 34, .16); }
    .cover { min-height: 340px; background: #d9d0bf; }
    .cover img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .content { padding: clamp(28px, 5vw, 58px); align-self: center; }
    .meta { color: var(--accent); font-size: .88rem; font-weight: 750; letter-spacing: .05em; }
    h3 { margin: 10px 0 16px; font-size: clamp(1.8rem, 4vw, 3.15rem); line-height: 1.16; letter-spacing: -.035em; }
    .summary { margin: 0 0 24px; color: var(--muted); }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { padding: 5px 11px; color: #5b5147; background: #eee9df; border-radius: 999px; font-size: .82rem; }
    footer { padding: 28px 0 44px; color: var(--muted); border-top: 1px solid var(--line); font-size: .9rem; }
    @media (max-width: 760px) {
      header { padding-top: 48px; }
      .post { grid-template-columns: 1fr; }
      .cover { min-height: 250px; max-height: 440px; }
    }
  </style>
</head>
<body>
  <header class="shell">
    <div class="eyebrow">Shuimu · Digital Notes</div>
    <h1>水木的技术博客</h1>
    <p class="intro">记录智能电视、开源软件、家庭影音与数码实践。这里的文章来自真实设备、真实命令和完整验证。</p>
  </header>

  <main class="shell">
    <div class="section-title">
      <h2>最新文章</h2>
      <span class="count">1 篇</span>
    </div>

    <a class="post" href="sony-bravia-free-airplay-guide.html">
      <div class="cover">
        <img src="xiaohongshu-cover.png" alt="索尼 BRAVIA 电视免费 AirPlay 实战封面">
      </div>
      <div class="content">
        <div class="meta">2026-09-02 · 家庭影音</div>
        <h3>索尼 BRAVIA 5 免费 AirPlay 实战</h3>
        <p class="summary">从 macOS 与 Windows 安装 ADB、无线配对和端口避坑，到安装开源 AirPlay 接收器并验证 4K HEVC 镜像。全程不破解付费应用，所有改动均可恢复。</p>
        <div class="tags">
          <span class="tag">Android TV</span>
          <span class="tag">AirPlay</span>
          <span class="tag">ADB</span>
          <span class="tag">开源软件</span>
        </div>
      </div>
    </a>
  </main>

  <footer>
    <div class="shell">© 2026 Shuimu · Built with GitHub Pages</div>
  </footer>
</body>
</html>
